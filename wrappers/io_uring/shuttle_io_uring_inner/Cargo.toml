[package]
name = "shuttle-io-uring-inner"
version = "0.1.0"
edition = "2024"
# This crate began as a fork of turmoil-io-uring, which is MIT-licensed: see LICENSE-MIT, and each
# file's header for whether it is derived from that crate or new here. The parts that are not
# derived, and the changes to the ones that are, are Apache-2.0, as the rest of Shuttle is.
license = "Apache-2.0 AND MIT"
description = "Shuttle's internal implementation of the `io-uring` crate: a simulated kernel ring whose completions Shuttle schedules. Do not depend on this crate directly; use `shuttle-io-uring`."
repository = "https://github.com/awslabs/shuttle"
# These tests share their sources with `shuttle-io-uring`'s tests, which are outside of this package.
exclude = ["tests/consumer.rs", "tests/parity.rs"]

[features]
# io-uring's `io_safety`, which adds `AsFd for IoUring`.
io_safety = []

# The simulation runs Linux system calls on the files an op names, as io_uring does. On other targets
# this crate is empty.
[target.'cfg(target_os = "linux")'.dependencies]
bitflags = "2"
libc = "0.2.98"
# 0.9.2 is the first `shuttle` built on `shuttle-engine`, so that the engine below is the one that
# runs the test.
shuttle = { path = "../../../shuttle", version = "0.9.2" }
# For `ExecutionState::{get_storage, init_storage}`, which hold the simulation's state for one
# execution.
shuttle-engine = { path = "../../../shuttle-engine", version = "0.1" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.2.0"
# For the parity probe, which builds the same signatures against io-uring and this crate.
io-uring-orig = { package = "io-uring", version = "0.7.16" }
